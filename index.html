<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Survival</title>

<style>
body{
    margin:0;
    background:#050816;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

canvas{
    background:#0f172a;
    border:3px solid #00e5ff;
    box-shadow:0 0 20px #00e5ff;
}

#ui{
    position:absolute;
    top:10px;
    color:white;
    font-size:22px;
}
</style>
</head>
<body>

<div id="ui">Skor: <span id="score">0</span></div>

<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");

const player = {
    x:400,
    y:250,
    size:15,
    speed:6
};

let score = 0;
let gameOver = false;
let keys = {};
let enemies = [];

document.addEventListener("keydown",(e)=>{
    keys[e.key]=true;

    if(gameOver && e.key.toLowerCase()==="r"){
        restart();
    }
});

document.addEventListener("keyup",(e)=>{
    keys[e.key]=false;
});

function addEnemy(){

    let speed = 2 + Math.random()*2;

    enemies.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        size:12 + Math.random()*10,
        dx:(Math.random()>0.5?1:-1)*speed,
        dy:(Math.random()>0.5?1:-1)*speed
    });
}

for(let i=0;i<5;i++){
    addEnemy();
}

setInterval(()=>{
    if(!gameOver){
        addEnemy();
    }
},5000);

function update(){

    if(gameOver) return;

    if(keys["w"]||keys["ArrowUp"])
        player.y-=player.speed;

    if(keys["s"]||keys["ArrowDown"])
        player.y+=player.speed;

    if(keys["a"]||keys["ArrowLeft"])
        player.x-=player.speed;

    if(keys["d"]||keys["ArrowRight"])
        player.x+=player.speed;

    player.x=Math.max(player.size,
        Math.min(canvas.width-player.size,player.x));

    player.y=Math.max(player.size,
        Math.min(canvas.height-player.size,player.y));

    enemies.forEach(enemy=>{

        enemy.x+=enemy.dx;
        enemy.y+=enemy.dy;

        if(enemy.x<enemy.size ||
           enemy.x>canvas.width-enemy.size){
            enemy.dx*=-1;
        }

        if(enemy.y<enemy.size ||
           enemy.y>canvas.height-enemy.size){
            enemy.dy*=-1;
        }

        const dx=player.x-enemy.x;
        const dy=player.y-enemy.y;
        const dist=Math.sqrt(dx*dx+dy*dy);

        if(dist < player.size + enemy.size){
            gameOver=true;
        }
    });

    score++;
    scoreText.textContent=Math.floor(score/10);
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    enemies.forEach(enemy=>{

        ctx.beginPath();
        ctx.arc(enemy.x,enemy.y,enemy.size,0,Math.PI*2);

        ctx.fillStyle="#ff3b3b";
        ctx.fill();

        ctx.shadowColor="#ff3b3b";
        ctx.shadowBlur=15;
    });

    ctx.shadowBlur=0;

    ctx.beginPath();
    ctx.arc(player.x,player.y,player.size,0,Math.PI*2);

    ctx.fillStyle="#00ff88";
    ctx.fill();

    if(gameOver){

        ctx.fillStyle="rgba(0,0,0,0.75)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="white";
        ctx.textAlign="center";

        ctx.font="50px Arial";
        ctx.fillText(
            "GAME OVER",
            canvas.width/2,
            220
        );

        ctx.font="28px Arial";
        ctx.fillText(
            "Skor: " + Math.floor(score/10),
            canvas.width/2,
            280
        );

        ctx.font="22px Arial";
        ctx.fillText(
            "Tekan R untuk bermain lagi",
            canvas.width/2,
            330
        );
    }
}

function restart(){

    score=0;
    gameOver=false;
    enemies=[];

    player.x=400;
    player.y=250;

    for(let i=0;i<5;i++){
        addEnemy();
    }
}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
