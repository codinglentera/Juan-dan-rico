<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impossible Gap</title>

<style>
body{
    margin:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

canvas{
    background:#222;
    border:3px solid #fff;
}

#score{
    position:absolute;
    top:15px;
    color:white;
    font-size:24px;
}
</style>
</head>
<body>

<div id="score">Skor: 0</div>
<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");

const player = {
    x: 180,
    y: 540,
    w: 40,
    h: 40,
    speed: 7
};

let keys = {};
let score = 0;
let gameOver = false;
let obstacleSpeed = 4;

const obstacles = [];

document.addEventListener("keydown", e=>{
    keys[e.key] = true;

    if(gameOver && e.key.toLowerCase() === "r"){
        restart();
    }
});

document.addEventListener("keyup", e=>{
    keys[e.key] = false;
});

function createObstacle(){

    const gapWidth = 70; // sengaja sempit

    const gapX =
        Math.random() * (canvas.width - gapWidth);

    obstacles.push({
        y:-30,
        gapX,
        gapWidth,
        h:30,
        passed:false
    });
}

setInterval(()=>{
    if(!gameOver){
        createObstacle();
    }
},1000);

function update(){

    if(gameOver) return;

    if(keys["ArrowLeft"] || keys["a"])
        player.x -= player.speed;

    if(keys["ArrowRight"] || keys["d"])
        player.x += player.speed;

    player.x = Math.max(
        0,
        Math.min(canvas.width-player.w, player.x)
    );

    obstacles.forEach(ob=>{

        ob.y += obstacleSpeed;

        if(!ob.passed && ob.y > player.y){
            score++;
            ob.passed = true;
        }

        if(
            player.y < ob.y + ob.h &&
            player.y + player.h > ob.y
        ){
            if(
                player.x < ob.gapX ||
                player.x + player.w > ob.gapX + ob.gapWidth
            ){
                gameOver = true;
            }
        }
    });

    if(score > 0 && score % 10 === 0){
        obstacleSpeed = 4 + score / 20;
    }

    scoreText.textContent = "Skor: " + score;
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Player
    ctx.fillStyle = "#00ff88";
    ctx.fillRect(
        player.x,
        player.y,
        player.w,
        player.h
    );

    // Obstacles
    ctx.fillStyle = "#ff4444";

    obstacles.forEach(ob=>{

        ctx.fillRect(
            0,
            ob.y,
            ob.gapX,
            ob.h
        );

        ctx.fillRect(
            ob.gapX + ob.gapWidth,
            ob.y,
            canvas.width,
            ob.h
        );
    });

    if(gameOver){

        ctx.fillStyle="rgba(0,0,0,0.7)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="white";
        ctx.textAlign="center";

        ctx.font="40px Arial";
        ctx.fillText(
            "GAME OVER",
            canvas.width/2,
            250
        );

        ctx.font="22px Arial";
        ctx.fillText(
            "Skor: " + score,
            canvas.width/2,
            300
        );

        ctx.fillText(
            "Tekan R untuk ulang",
            canvas.width/2,
            340
        );
    }
}

function restart(){

    score = 0;
    obstacleSpeed = 4;
    obstacles.length = 0;

    player.x = 180;

    gameOver = false;
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
